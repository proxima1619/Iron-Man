name: iron-man
services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      IRON_MAN_DB_PATH: /data/ironman.sqlite3
      IRON_MAN_TEP_ENGINE_DIR: /opt/tep
      IRON_MAN_TEP_RUN_DIR: /data/tep-runs
      IRON_MAN_TEP_CONTRACT_PATH: /app/contracts/tep-model.json
      IRON_MAN_TEP_EVIDENCE_SOURCE_PATH: ${IRON_MAN_TEP_EVIDENCE_SOURCE_PATH:-/app/data/sources/paper-sources.json}
      IRON_MAN_TEP_EVIDENCE_QUERY: ${IRON_MAN_TEP_EVIDENCE_QUERY:-}
      IRON_MAN_EVIDENCE_MODE: ${IRON_MAN_EVIDENCE_MODE:-fixture}
      IRON_MAN_EVIDENCE_MODEL: ${IRON_MAN_EVIDENCE_MODEL:-}
      IRON_MAN_EVIDENCE_TIMEOUT_S: ${IRON_MAN_EVIDENCE_TIMEOUT_S:-20}
      IRON_MAN_EVIDENCE_SOURCE_MODE: ${IRON_MAN_EVIDENCE_SOURCE_MODE:-local}
      IRON_MAN_EVIDENCE_SOURCE_PATH: ${IRON_MAN_EVIDENCE_SOURCE_PATH:-/app/data/sources/cooling-demo.json}
      IRON_MAN_FEEDBACK_SOURCE_PATH: ${IRON_MAN_FEEDBACK_SOURCE_PATH:-/app/data/sources/paper-sources.json}
      IRON_MAN_EVIDENCE_QUERY: ${IRON_MAN_EVIDENCE_QUERY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      IRON_MAN_EVALUATION_WORKERS: ${IRON_MAN_EVALUATION_WORKERS:-2}
      IRON_MAN_EVALUATION_TIMEOUT_S: ${IRON_MAN_EVALUATION_TIMEOUT_S:-90}
      IRON_MAN_OPERATOR_TOKEN: ${IRON_MAN_OPERATOR_TOKEN:-local-operator}
      IRON_MAN_APPROVER_TOKEN: ${IRON_MAN_APPROVER_TOKEN:-local-approver}
      IRON_MAN_APPROVER_LABEL: ${IRON_MAN_APPROVER_LABEL:-local-approver}
      IRON_MAN_NEGLIGIBLE_DELTA_C: ${IRON_MAN_NEGLIGIBLE_DELTA_C:-}
      IRON_MAN_APPROVER_EMAIL: ${IRON_MAN_APPROVER_EMAIL:-}
      IRON_MAN_SMTP_HOST: ${IRON_MAN_SMTP_HOST:-}
      IRON_MAN_SMTP_PORT: ${IRON_MAN_SMTP_PORT:-587}
      IRON_MAN_SMTP_FROM: ${IRON_MAN_SMTP_FROM:-}
      IRON_MAN_SMTP_USER: ${IRON_MAN_SMTP_USER:-}
      IRON_MAN_SMTP_PASSWORD: ${IRON_MAN_SMTP_PASSWORD:-}
    volumes:
      - gateway-data:/data
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      - "${IRON_MAN_BIND_HOST:-127.0.0.1}:${IRON_MAN_HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gateway-data:
