name: checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -c requirements-dev.lock.txt -e '.[dev]'
      - run: python -m backend.simulator.tep.build
      - run: pytest -q
        env:
          IRON_MAN_TEST_TEP: '1'
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run generate:api
      - run: git diff --exit-code -- src/api.generated.ts
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: iron-man-ci
      IRON_MAN_HTTP_PORT: '18080'
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 120
      - run: python3 -m scripts.compose_smoke http://127.0.0.1:18080
      - if: failure()
        run: docker compose logs --tail=150
      - if: always()
        run: docker compose down

  https:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: iron-man-https-ci
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m scripts.deploy_config --domain localhost
      - name: Check the public deployment model without exposing config values
        run: |
          python3 - <<'PY'
          import json, subprocess
          from scripts.deploy_check import check
          command = ['docker', 'compose', '--env-file', '.env.deploy', '-f', 'compose.deploy.yaml', 'config', '--format', 'json']
          config = json.loads(subprocess.check_output(command))
          config['services']['caddy']['environment']['DEMO_DOMAIN'] = 'demo.example.com'
          check(config)
          PY
      - name: Start HTTPS with the CI-local certificate authority
        run: |
          docker compose --env-file .env.deploy -f compose.deploy.yaml -f deploy/test/compose.yaml up -d --build --wait --wait-timeout 120
          docker compose --env-file .env.deploy -f compose.deploy.yaml -f deploy/test/compose.yaml exec -T caddy caddy validate --config /etc/caddy/Caddyfile.test --adapter caddyfile
      - name: Wait for TLS and copy the test CA
        run: |
          for attempt in $(seq 1 30); do
            if docker compose --env-file .env.deploy -f compose.deploy.yaml -f deploy/test/compose.yaml cp caddy:/data/caddy/pki/authorities/local/root.crt .deploy-private/ca.crt; then break; fi
            sleep 1
          done
      - name: Verify public HTTPS and API role authentication
        run: python3 -m scripts.https_smoke --url https://localhost:18443 --http-url http://localhost:18082 --ca-file .deploy-private/ca.crt
      - name: Install browser smoke dependencies and trust only the test CA
        run: |
          python3 -m pip install playwright==1.63.0
          python3 -m playwright install --with-deps chromium
          sudo apt-get install -y libnss3-tools
          mkdir -p "$HOME/.pki/nssdb"
          certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password
          certutil -d "sql:$HOME/.pki/nssdb" -A -t 'C,,' -n IronManCI -i .deploy-private/ca.crt
      - name: Verify the actual browser authentication and polling flow
        run: python3 -m scripts.browser_smoke --url https://localhost:18443
      - if: failure()
        run: docker compose --env-file .env.deploy -f compose.deploy.yaml -f deploy/test/compose.yaml logs --tail=100
      - if: always()
        run: docker compose --env-file .env.deploy -f compose.deploy.yaml -f deploy/test/compose.yaml down
