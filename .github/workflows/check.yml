name: checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -c requirements-dev.lock.txt -e '.[dev]'
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run generate:api
      - run: git diff --exit-code -- src/api.generated.ts
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: iron-man-ci
      IRON_MAN_HTTP_PORT: '18080'
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 120
      - run: python3 -m scripts.compose_smoke http://127.0.0.1:18080
      - if: failure()
        run: docker compose logs --tail=150
      - if: always()
        run: docker compose down
